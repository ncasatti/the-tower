# herdr configuration — The Tower
# Mirrors the user's established Colemak tmux convention so muscle memory
# transfers 1:1. See tmux/TMUX_KEYBINDINGS.md for the source-of-truth binds.
#
# Model mapping: herdr workspace ≈ tmux session, herdr tab ≈ tmux window,
# herdr pane ≈ tmux pane. Only overrides are listed; everything else keeps
# herdr's defaults (a partial config is merged over the built-in defaults).

# Skip the first-run setup wizard on startup (top-level key: TOML requires it
# before any [table] header). We've already chosen our config declaratively.
onboarding = false

[theme]
# Pinned declaratively so the choice survives nixos-rebuild. Picking a theme
# from herdr's UI cannot persist: ~/.config/herdr/config.toml is a read-only
# store symlink. Built-ins: catppuccin, terminal, tokyo-night, dracula, nord,
# gruvbox, one-dark, solarized, kanagawa, rose-pine, vesper.
name = "terminal"

[keys]
# Prefix: Ctrl-a (parity with tmux; NOT the default ctrl+b).
# Caveat: collides if herdr is ever nested inside tmux — we don't nest.
prefix = "ctrl+a"

# --- Pane focus: Colemak inverted-T  n/e/u/i = left/down/up/right ---
focus_pane_left  = "prefix+n"
focus_pane_down  = "prefix+e"
focus_pane_up    = "prefix+u"
focus_pane_right = "prefix+i"

# Pane back-and-forth toggle (tmux last-pane). On prefix+a so prefix+l is
# free for previous_workspace below.
last_pane = "prefix+a"

# Tabs (tmux windows). prefix+n is now pane-left, so prev/next shift to
# Colemak home-row chords (prefix+shift+n/i). Browser-style alt bindings
# added (prefix+ctrl+tab / prefix+ctrl+shift+tab) to mirror the keyd navbar
# convention (navbar.1/2 = C-S-tab / C-tab).
previous_tab = "prefix+ctrl+n"
next_tab     = "prefix+ctrl+i"
new_tab      = "prefix+c"
rename_tab   = "prefix+r"
close_tab    = "prefix+ampersand"
switch_tab   = "prefix+1..9"

# Splits — herdr's action names are inverted vs the nvim mental model
# (:split = top/bottom, :vsplit = left/right). We bind each KEY to the action
# that yields the expected layout: prefix+h → horizontal (top/bottom split),
# prefix+v → vertical (left/right split). Hence the crossed action↔key mapping.
split_vertical   = "prefix+h"
split_horizontal = "prefix+v"
close_pane       = "prefix+x"     # tmux: kill pane

# Session/UI actions mirrored from tmux.
detach        = "prefix+d"        # tmux: detach (default was prefix+q)
reload_config = "prefix+ctrl+r"   # ctrl-r convention; prefix+R ≡ shift+r collides with resize_mode default
resize_mode   = "prefix+shift+r"  # moved off prefix+r to free reload
zoom          = "prefix+z"
help          = "prefix+?"

# Jump + notifications — swapped to match tmux muscle memory:
#   goto                     -> prefix+o (default was prefix+g)
#   open_notification_target -> prefix+g (default was prefix+o)
# Clean swap, so neither action is left unbound.
goto                     = "prefix+o"
open_notification_target = "prefix+g"

# Workspace cycling on prefix+y / prefix+l.
next_workspace     = "prefix+y"
previous_workspace = "prefix+l"
# Indexed workspace jump (ctrl because alt=Meta in Hyprland, shift+digits blocked upstream).
switch_workspace   = "prefix+ctrl+1..9"

# New workspace on prefix+shift+c — pairs with new_tab (prefix+c) as the
# "create" family; shift = one level up (workspace vs tab). Default was
# prefix+shift+n, which herdr auto-unsets when we rebind here.
new_workspace = "prefix+ctrl+c"

# Agent navigation — mirrors the workspace binds one level up (shift). Jumps
# focus to the next/previous detected agent; with agent_panel_sort = "priority"
# next lands on whoever needs attention first.
next_agent     = "prefix+ctrl+y"
previous_agent = "prefix+ctrl+l"
focus_agent    = "prefix+shift+1..9"

# --- Navigate-mode movement: same Colemak inverted-T, no prefix ---
# Do NOT add prefix+, esc, enter, tab, or 1..9 here (herdr constraint).
navigate_pane_left  = "n"
navigate_pane_down  = "e"
navigate_pane_up    = "u"
navigate_pane_right = "i"

[ui]
# Show the detected agent (claude, codex, gemini, ...) in a split pane's border
# when the pane has no manual name. A manual rename_pane always wins.
show_agent_labels_on_pane_borders = true

[ui.toast]
# In-app popup notifications (default was "off", hence nothing showed up).
# "herdr" = toasts rendered inside the TUI. Other options: "terminal" (desktop
# notification via the outer terminal) or "system" (OS notification service).
delivery = "herdr"

[experimental]
# Propagate the kitty graphics protocol through herdr so attached apps
# (nvim + snacks.image, lazygit diffs, ...) can render inline images and
# LaTeX math at the host terminal. Off by default in herdr; safe to turn
# on when the outer terminal is kitty or any other graphics-protocol
# capable emulator. See https://herdr.dev/docs/configuration#kitty-graphics
kitty_graphics = true
