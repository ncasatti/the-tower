# wallust configuration - for wallust version 3.0

# How the image is parse, in order to get the colors:
# full - resized - wal - thumb -  fastresize - kmeans
# - kmeans:               clusteriza píxeles en N colores dominantes (rápido)
# - resized:              resize + kmeans (más preciso, más lento)
# - full:                 análisis completo (más lento, máxima calidad)
# - fastresize/wal/thumb: legacy / menos precisos
backend = "full"

# What color space to use to produce and select the most prominent colors:
# lab - labmixed - lch - lchmixed
# - lab:      CIELAB puro (perceptual, ideal pero a veces falla con colores muy oscuros)
# - labmixed: lab + fallback RGB (default robusto)
# - lch:      lab en coordenadas cilíndricas
# - lchmixed: igual con fallback
color_space = "lab"


# Use the most prominent colors in a way that makes sense, a scheme:
# - dark/dark16:         8 colores oscuros del wallpaper, los otros 8 son variaciones por lightness
# - harddark/harddark16: igual pero con hues "duros" (sin interpolación), 16-color usa opacity tricks
# - softdark/softdark16: tonos pastel oscuros
# - light/softlight:     invertido (claro)
palette = "dark16"

# Difference between similar colors, used by the colorspace:
# - 1:     indistinguibles al ojo
# - 2-10:  perceptibles al vistazo (tu valor)
# - 11-49: más similares que opuestos
# - 100:   colores opuestos exactos
threshold = 10

[templates]
cava.template = 'colors-cava'
cava.target = '~/.config/cava/config'

hypr.template = 'colors-hyprland.conf'
hypr.target = '~/.cache/hypr/wallust/wallust-hyprland.conf'

rofi.template = 'colors-rofi.rasi'
rofi.target = '~/.cache/hypr/wallust/colors-rofi.rasi'

waybar.template = 'colors-waybar.css'
waybar.target = '~/.cache/hypr/wallust/colors-waybar.css'

kitty.template = 'colors-kitty.conf'
kitty.target = '~/.cache/hypr/wallust/colors-kitty.conf'

bash.template = 'colors-bash'
bash.target = '~/.cache/hypr/wallust/colors-bash.sh'

swaync.template = 'colors-swaync.css'
swaync.target = '~/.cache/hypr/wallust/colors-swaync.css'

#macchina.template = 'colors-macchina.toml'
#macchina.target = '~/.cache/wallust/colors-macchina.toml'

#wezterm.template = 'colors-wezterm.toml'
#wezterm.target = '~/.cache/wallust/colors-wezterm.toml'

