# Alpha-aware variants for transparent UI elements (8-digit hex with alpha 0xb3).
# Append 0xb3 (~70% opacity) to the standard 6-digit hex. Update suffix to change alpha.
$background_alpha = rgba({{background | strip}}cc)
$color0_alpha =         rgba({{color0 | strip}}cc)
