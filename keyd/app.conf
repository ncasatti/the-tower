# keyd-application-mapper: per-window masks over /etc/keyd/default.conf.
# Each section applies while a matching window is focused; on focus loss
# keyd resets to default.conf.
#
#   [<class glob>]               match by class
#   [<class glob>|<title glob>]  match by class and title
#
# Each line is a `keyd bind` expression: [<layer>.]<key> = <key|macro|action>.
# Rules (verified against keyd 2.6.0):
#   - the layer must already exist in default.conf (bind cannot create layers)
#   - ONE invalid line makes the whole section fail to apply
#   - comments only on their own line (no trailing `# ...`)
#   - key names are PHYSICAL (QWERTY scancodes); xkb applies Colemak after
#
# Iterate without rebuild:
#   systemctl --user restart keyd-application-mapper
#   keyd-application-mapper -v     # prints class/title of focused windows
#
# The mapper NORMALIZES class and title before matching (lowercase, runs of
# non-alphanumerics -> '-') but compares against the header literally:
#   steam_app_default | StarCraft II  ->  steam-app-default | starcraft-ii
# StarCraft II and Battle.net share that class; filter on title.

[steam-app-default|starcraft-ii]

# --- Menu 1: hold space (navbar layer) ---

# Camera locations. Colemak legend: q w f p / a r s t
navbar.q = f1
navbar.w = f2
navbar.e = f3
navbar.r = f4
navbar.a = f5
navbar.s = f6
navbar.d = f7
navbar.f = f8

# Far control groups (base, research, ...)
navbar.z = 7
navbar.x = 8
navbar.c = 9
navbar.v = 0

# space+tab = backspace; space+capslock = '=' (bound in-game to follow unit)
navbar.tab = backspace
navbar.capslock = =

# Hold capslock = arrows (camera scroll). Reuses the existing `symbols`
# layer (bind cannot create layers); only a/s/d/w are remapped, its other
# symbol keys stay as in default.conf. Colemak legend: a r s w
capslock = layer(symbols)
symbols.a = left
symbols.s = down
symbols.d = right
symbols.w = up

# One-shot modifiers: tap once, applies to the next key; holding still
# works as a normal modifier. Left alt = Ctrl+Shift (layer sc2mod in
# default.conf), so the game never sees a real Alt, which Hyprland binds
# with digits. Right alt keeps the Hyprland leader.
control = oneshot(control)
shift = oneshot(shift)
leftalt = oneshot(sc2mod)
