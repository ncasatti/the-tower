[opener]
edit = [
    { run = '${EDITOR:-nvim} %s', block = true, desc = "Edit" },
]
vlc = [
    { run = 'vlc %s', desc = "Abrir con VLC" },
]
mpv = [
    { run = 'mpv %s', desc = "Abrir con MPV" },
]
xdg = [
    { run = 'xdg-open %s', desc = "Abrir con la app predeterminada" },
]

[open]
rules = [
    # Text-like files → edit in nvim. Match by filename (`url`), NOT mime:
    # libmagic misclassifies .lua as application/javascript and .json as
    # application/json, which would otherwise miss the `text/*` rule below.
    { url = "*.{txt,md,json,yaml,yml,toml,fish,nix,lua,py,sh,js,ts,go,rs,cpp,c,h,hpp}", use = ["edit"] },
    { mime = "text/*", use = ["edit"] },

    # PDFs → xdg-open delegates to zathura per xdg.nix
    { mime = "application/pdf", use = ["xdg"] },

    # Video → multi-choice (preferred apps first, xdg as fallback)
    { mime = "video/*", use = ["vlc", "mpv", "xdg"] },

    # Catch-all → xdg-open consults mimeapps.list (single source of truth)
    { mime = "*/*", use = ["xdg"] },
]
