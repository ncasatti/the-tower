# Monitor layout — notebook (portable workstation)
# Host-scoped (ADR-003). Selected by nix/hosts/notebook/home.nix, which links
# this file to ~/.config/hypr/configs/monitors.local.conf.
#
# eDP-1: AU Optronics 0x3191, 340x190 mm, NATIVE 1366x768 (first line of
# /sys/class/drm/card1-eDP-1/modes). Do not force 1920x1080: i915 accepts it
# and downscales through the panel fitter, which blurs every glyph.
# Keep scale = 1: fractional scaling blurs the 3270 bitmap-style font.

env = GDK_SCALE,1

monitorv2 {
    output = eDP-1
    position = 0x0
    mode = 1366x768@60
    scale = 1
}

monitorv2 {
    output = HDMI-A-1
    mode = 1920x1080
    # mode = 4096x2160
    position = 1366x0
    scale = 2
}
