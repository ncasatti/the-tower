# Monitor layout — notebook (portable workstation)
# PLACEHOLDER: currently a replica of main.conf. The real notebook layout
# (eDP-1 panel + optional external HDMI) is to be filled in by the User.
# Host-scoped (ADR-003). Selected by nix/hosts/notebook/home.nix, which links
# this file to ~/.config/hypr/configs/monitors.local.conf.

env = GDK_SCALE,1

monitorv2 {
    output = eDP-1
    position = 0x0
    mode = 1920x1080
    scale = 1
}

monitorv2 {
    output = HDMI-A-1
    mode = 1920x1080
    # mode = 4096x2160
    position = 1920x0
    scale = 2
}
