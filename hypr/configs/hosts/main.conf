# Monitor layout — main (primary workstation "the-grid")
# Dual output: DP-1 primary @ 0x0 (144 Hz) + HDMI-A-1 rotated to portrait, left.
# Host-scoped (ADR-003). Selected by nix/hosts/main/home.nix, which links this
# file to ~/.config/hypr/configs/monitors.local.conf (sourced by hyprland.conf).

env = GDK_SCALE,1

# Rotated
# monitorv2 {
#     output = HDMI-A-1
#     mode = 1920x1080
#     position = -1080x-300
#     scale = 1
#     transform = 1
# }

# Normal
monitorv2 {
    output = HDMI-A-1
    mode = 1920x1080
    position = -1920x0
    scale = 1
}

monitorv2 {
    output = DP-1
    mode = 1920x1080@144
    position = 0x0
    scale = 1
}
