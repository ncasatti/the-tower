# Monitor layout — server (HTPC, single TV over HDMI)
# The TV is THE monitor. Any laptop-lid panel stays disabled: a second output
# creates focus/input ambiguity for remote control (windows opening on the
# unseen screen). This is what previously lived in hypr-host.conf; now it is
# host-scoped like the others (ADR-003). Selected by nix/hosts/server/home.nix,
# which links this file to ~/.config/hypr/configs/monitors.local.conf.

env = GDK_SCALE,1

monitor = HDMI-A-1, 1920x1080@60, 0x0, 1
monitor = eDP-1, disable
