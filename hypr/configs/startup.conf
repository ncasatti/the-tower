#Commands & Apps to be executed at launch

$scripts = $HOME/.config/hypr/scripts

$wallDIR=$HOME/Pictures/wallpapers
$AwwwRandom = $scripts/theme/wallpaper-autochange.sh

# wallpaper stuff / More wallpaper options below
exec-once = awww-daemon --format xrgb
#exec-once = $AwwwRandom $wallDIR # random wallpaper switcher every 30 minutes 

# Startup
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# graphical-session.target — required by xdg-desktop-portal (>= 1.22.0), whose
# unit declares `Requisite=graphical-session.target`. This session is started
# manually from a TTY (no display manager), so nothing else ever activates that
# target: the portal then dies with "Job xdg-desktop-portal.service/start failed
# with result 'dependency'" and screen sharing (Meet, Discord) is refused.
# nixos-fake-graphical-session.target is NixOS' own bridge for this case — it
# BindsTo graphical-session.target and pulls it in when started.
exec-once = systemctl --user start nixos-fake-graphical-session.target

# Enable hy3 plugin at startup
exec-once = hyprpm reload -n

# cursor
exec-once = hyprctl setcursor DeppinDark-cursors 24

# Polkit — hyprpolkitagent, declared via Home Manager (nix/home/polkit.nix)
exec-once = systemctl --user start hyprpolkitagent.service

# starup apps
exec-once = waybar &
exec-once = nm-applet --indicator &
exec-once = swaync &
exec-once = ags &
#exec-once = blueman-applet & 
#exec-once = rog-control-center &

#clipboard manager
exec-once = wl-paste --type text --watch cliphist store 
exec-once = wl-paste --type image --watch cliphist store

# Rainbow borders
exec-once = $scripts/theme/rainbow-borders.sh &

# Starting hypridle to start hyprlock
exec-once = hypridle &

# Start pyprland daemon
exec-once = pypr &

#gnome polkit for nixos
#exec-once = $scripts/system/polkit-nixos.sh

# xdg-desktop-portal-hyprland (should be auto starting. However, you can force to start)
#exec-once = $scripts/system/portal-hyprland.sh

# Obsidian
exec-once = obsidian
