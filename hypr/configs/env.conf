#environment-variables
env = CLUTTER_BACKEND,wayland
env = GDK_BACKEND,wayland,x11
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt5ct
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_SCALE_FACTOR,1
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland

# xwayland apps scale fix (useful if you are use monitor scaling)
# see https://wiki.hyprland.org/Configuring/XWayland/
# toolkit-specific scale
# env = GDK_SCALE,2

# firefox
env = MOZ_ENABLE_WAYLAND,1
env = NIXOS_OZONE_WL,1

# electron >28 apps (may help)
env = ELECTRON_OZONE_PLATFORM_HINT,auto

# ---------------------------------------------------------------------------
# GPU / VA-API / GL-vendor env is HOST-SPECIFIC and lives in the nix layer,
# NOT here — this file is sourced by EVERY host and their GPUs differ
# (main=NVIDIA, notebook=AMD, server=Intel). A hardcoded vendor value here
# breaks the other two hosts: it caused the server blank screen
# (__GLX_VENDOR_LIBRARY_NAME=nvidia on an Intel box) and the notebook Tidal
# freeze (LIBVA_DRIVER_NAME=nvidia on an AMD box). Driver selection per host:
#   main     -> nix/hosts/main/nvidia.nix  (GBM_BACKEND, __GLX_VENDOR_LIBRARY_NAME,
#               EGL_PLATFORM; deliberately NO VA-API — see ADR-002)
#   server   -> nix/hosts/server/htpc.nix  (LIBVA_DRIVER_NAME=iHD)
#   notebook -> mesa autodetection (radeonsi)
# See docs/adr/001-host-scoped-gpu-environment.md
# ---------------------------------------------------------------------------

# cursor
env = XCURSOR_THEME,DeppinDark-cursors
env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,DeppinDark-cursors
env = HYPRCURSOR_SIZE,24

# Clingy CLI framework
# env = CLINGY_ROOT,/home/ncasatti/.the-grid/clingy
