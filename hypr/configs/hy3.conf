# hy3 Plugin Configuration
# i3/sway-style manual tiling with node-based window management
# Documentation: https://github.com/outfoxxed/hy3

source = $HOME/.cache/hypr/wallust/wallust-hyprland.conf

plugin {
  hy3 {
    # no_gaps_when_only <int> - hide gaps when only one window visible
    # 0 = disabled (default)
    # 1 = hide gaps when only single window visible
    # 2 = hide gaps when only one window in a group
    no_gaps_when_only = 0

    # node_collapse_policy <int> - behavior when groups become empty
    # 0 = remove when empty and has parent node
    # 1 = remove when empty
    # 2 = never remove (default)
    # 3 = always remove
    node_collapse_policy = 3

    # group_inset <int> - pixel offset for single-window groups
    group_inset = 5

    # tab bar configuration
    tabs {
      # Tab bar dimensions - thin and minimal like your borders
      border_width = 0
      height = 5
      padding_top = 4
      from_top = true
      radius = 2

      # Text rendering
      render_text = false
      text_center = false
      # text_font = CascadiaCode Nerd Font
      text_height = 8
      text_padding = 12

      # Colors using wallust-generated theme
      # Blurred black background aesthetic
      col.active = $color0_alpha
      col.active.border = $color0_alpha
      col.inactive = rgba(00000099)
      col.inactive.border = rgba(00000099)
      col.urgent = rgba(A2ADA3FF)
      col.text.active = $foreground
      col.text.urgent = $foreground
      col.text.inactive = $color3
    }

    # autotiling - automatic split direction based on window size
    autotile {
      enable = true
      # trigger_width = -1 disables the horizontal->vertical reflow.
      #
      # hy3 reflows a SplitH group into SplitV as soon as adding a window
      # would drop the per-window width below this trigger
      # (monitor_width / (children + 1) < trigger_width). With 800 on a
      # 2560px monitor, 3 windows => 640 < 800, so the whole group flipped
      # into a vertical stack. That left `movefocus r` with no horizontal
      # sibling: Hy3Node::findNeighbor returned nullptr and hy3 walked the
      # focus to the next monitor instead of the next window.
      #
      # -1 is the sentinel the autotile guard checks for
      # (`if (trigger >= 0 && ...)`), so the reflow never fires. Windows on
      # a landscape monitor stay side by side and movefocus only crosses
      # monitors when you are genuinely on the last one — i3/sway behaviour.
      #
      # trigger_height still governs the vertical->horizontal direction.
      trigger_width = -1
      trigger_height = 500
    }
  }
}
