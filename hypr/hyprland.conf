# Sourcing external config files

# Default Configs
$configs = $HOME/.config/hypr/configs

source=$configs/settings.conf
# Host-scoped monitor layout (ADR-003). Home Manager links the per-host file
# from configs/hosts/<host>.conf to this stable name. The old shared
# monitors.conf is no longer sourced.
source=$configs/monitors.local.conf
source=$configs/workspaces.conf
source=$configs/windows.conf
source=$configs/env.conf
source=$configs/startup.conf
source=$configs/laptop.conf

source=$configs/keybinds.conf

# Per-host overrides (generated by Home Manager). Sourced LAST so it wins over
# the shared configs. Monitor layout is host-scoped in configs/hosts/<host>.conf
# (via monitors.local.conf above, ADR-003); this file now carries only the
# remaining per-host session tweaks (e.g. the server's Intel VA-API env).
source=$HOME/.config/hypr-host.conf