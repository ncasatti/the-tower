# Sourcing external config files

# Default Configs
$configs = $HOME/.config/hypr/configs

source=$configs/settings.conf
source=$configs/monitors.conf
source=$configs/workspaces.conf
source=$configs/windows.conf
source=$configs/env.conf
source=$configs/startup.conf
source=$configs/laptop.conf

source=$configs/keybinds.conf

# Per-host overrides (generated by Home Manager). Sourced LAST so it wins over
# monitors.conf/startup.conf. Empty on main/notebook; the server HTPC uses it to
# fix the TV output and launch hypr-rdp. See nix/hosts/server/home.nix.
source=$HOME/.config/hypr-host.conf