# version: 2.0.0 — Grid Discipline
# Palette (locked):
#   #6FC3DF  cyan    — Programs, safe, identity, ambient
#   #FFA500  orange  — Clu / attention / highlight / versions
#   #FF3030  red     — derez / error / danger only
#   dimmed white     — residual ambient text
"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false
continuation_prompt = "[┊┊ ](dimmed #6FC3DF)"

# Top line: ambient context (nix  [fill]  directory · branch · status · metrics).
# Bottom line: input prompt (◄ duration · jobs · sudo · ▶).
format = """\
$directory\
$nix_shell\
$container\
$fill\
$git_state\
$git_branch\
$git_status\
$git_metrics
$cmd_duration\
$jobs\
$sudo\
$shlvl\
$shell\
$env_var\
$username\
$character"""

right_format = """\
$singularity\
$kubernetes\
$vcsh\
$fossil_branch\
$hg_branch\
$pijul_channel\
$docker_context\
$package\
$c\
$cpp\
$cmake\
$cobol\
$daml\
$dart\
$deno\
$dotnet\
$elixir\
$elm\
$erlang\
$fennel\
$fortran\
$golang\
$guix_shell\
$haskell\
$haxe\
$helm\
$java\
$julia\
$kotlin\
$gradle\
$lua\
$nim\
$nodejs\
$ocaml\
$opa\
$perl\
$php\
$pulumi\
$purescript\
$python\
$raku\
$rlang\
$red\
$ruby\
$rust\
$scala\
$solidity\
$swift\
$terraform\
$vlang\
$vagrant\
$xmake\
$zig\
$buf\
$conda\
$pixi\
$meson\
$spack\
$memory_usage\
$aws\
$gcloud\
$openstack\
$azure\
$crystal\
$custom\
$status\
$os\
$battery"""

[fill]
symbol = ' '

# === Character — subtle Grid (data-flow arrow) ===
[character]
format = "$symbol "
success_symbol = "[▶](bold #6FC3DF)"
error_symbol   = "[▲](bold #FF3030)"
vimcmd_symbol  = "[■](bold #6FC3DF)"
vimcmd_replace_one_symbol = "[◌](bold #FFA500)"
vimcmd_replace_symbol     = "[□](bold #FFA500)"
vimcmd_visual_symbol      = "[▼](bold #6FC3DF)"

[env_var.VIMSHELL]
format = "[$env_value]($style)"
style = "italic #6FC3DF"

[sudo]
format = "[$symbol]($style)"
style = "bold italic #FFA500"
symbol = "⋈┈"
disabled = true

[username]
style_user = "italic #FFA500"
style_root = "bold italic #FF3030"
format = "[⭘ $user]($style) "
disabled = true
show_always = false

[hostname]
disabled = true

[directory]
home_symbol = "⌂"
truncation_length = 2
truncation_symbol = ""
read_only = " ◈"
read_only_style = "#FFA500"
use_os_path_sep = true
style = "italic #6FC3DF"
format = '[$path]($style)[$read_only]($read_only_style)'
repo_root_style  = 'bold #FFA500'
repo_root_format = '[$before_root_path](italic dimmed #6FC3DF)[$repo_root]($repo_root_style)[$path](italic #6FC3DF)[$read_only]($read_only_style)' # [△](bold #6FC3DF)

[cmd_duration]
min_time = 0
format = "[◄ $duration ](italic #FFA500)"
disabled = true

[jobs]
format = "[$symbol$number]($style) "
style = "#6FC3DF"
symbol = "[▶](italic #FFA500)"

[localip]
ssh_only = true
format = " ◯[$localipv4](bold #6FC3DF)"
disabled = true

[time]
disabled = true

# === Battery — energy disc, Grid thresholds (no green on the Grid) ===
[battery]
format = "[ $percentage $symbol]($style)"
full_symbol = "█"
charging_symbol = "[↑](italic bold #6FC3DF)"
discharging_symbol = "↓"
unknown_symbol = "░"
empty_symbol = "▃"

[[battery.display]]
threshold = 20
style = "italic bold #FF3030"

[[battery.display]]
threshold = 60
style = "italic #FFA500"

[[battery.display]]
threshold = 100
style = "italic #6FC3DF"

# === Git ===
[git_branch]
format = " [$branch(:$remote_branch)]($style)"
symbol = ""
style = "italic #6FC3DF"
truncation_symbol = "⋯"
truncation_length = 11
only_attached = true

[git_metrics]
format = ' [▴$added](italic #6FC3DF)[ ▿$deleted ](italic #FFA500)'
added_style = 'italic #6FC3DF'
deleted_style = 'italic #FFA500'
ignore_submodules = true
disabled = false

# git_status — collapsed semantics:
#   safe      = #6FC3DF cyan
#   attention = #FFA500 orange
#   danger    = #FF3030 red
[git_status]
style = "bold #6FC3DF"
format = " ([$ahead_behind$staged$modified$untracked$renamed$deleted$conflicted$stashed]($style))"
ahead      = "[ ](#6FC3DF)"
behind     = "[▿${count} ](#FFA500)"
diverged   = "[◇ ▴${ahead_count} ▿${behind_count} ](#FF3030)"
untracked  = "[](#FFA500)"
stashed    = "[◃◈](#6FC3DF)"
modified   = "[ ](#FFA500)"
staged     = "[ [$count](bold #6FC3DF)](#6FC3DF)"
renamed    = "[◎◦](#FFA500)"
deleted    = "[✕](#FF3030)"
conflicted = "[◪◦](#FF3030)"

# === Nix shell — Grid sigil ===
[nix_shell]
style = 'italic #FFA500'
symbol = ''
format = '[$symbol $state nix-env ](italic dimmed white)'
impure_msg  = '[◌](bold #FFA500)'
pure_msg    = '[⌾](bold #6FC3DF)'
unknown_msg = '[⌽](bold dimmed #FFA500)'

# =====================================================================
# Language modules — unified Grid format:
#   " [<icon> label](italic cyan) [version](italic orange)"
# Nerd-font glyphs (private use area). Requires a Nerd Font.
# =====================================================================

[package]
format = " [ pkg](italic dimmed #6FC3DF) [$version](italic #FFA500)"
version_format = "${raw}"
symbol = ""

[deno]
