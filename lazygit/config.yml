gui:
  # Stack the two main panels (Unstaged on top, Staged below) instead of
  # side-by-side. Default is "flexible", which flips based on window width —
  # that's why native and the snacks.nvim float disagreed. NOTE: lazygit's
  # naming is the inverse of tmux/vim — "vertical" = stacked top/bottom,
  # "horizontal" = side by side.
  mainPanelSplitMode: vertical
  # Ayu theme (mirrors nvim/lua/plugins/themes/ayu.lua). Inside nvim, snacks
  # regenerates this from the live colorscheme; here it makes native match.
  theme:
    activeBorderColor:
      - '#FF8F40'
      - bold
    inactiveBorderColor:
      - '#4F6166'
    optionsTextColor:
      - '#39BAE6'
    selectedLineBgColor:
      - '#1C2733'
    cherryPickedCommitBgColor:
      - '#334454'
    cherryPickedCommitFgColor:
      - '#39BAE6'
    unstagedChangesColor:
      - '#D26464'
    defaultFgColor:
      - '#BFBDB6'
    searchingActiveBorderColor:
      - '#FFB454'

  # Shrink the per-commit columns so the commit message gets more room. The
  # right panel still shows full hash + author + date + message on expansion
  # (it uses the `commit*Length` values below too), so the left panel only
  # needs row identification — typically the message itself is enough.
  # NOTE: lazygit has no `showAuthor/showHash/showDate: false` toggles; this
  # is the closest we can get to hiding them. `commitHashLength: 0` collapses
  # the hash to a '*' glyph; `commitAuthorShortLength: 0` collapses the
  # author column to nothing in the collapsed view. Slightly outside the
  # documented defaults (2/8/17) — bump up if it visually breaks.
  commitHashLength: 0
  commitAuthorShortLength: 0
  commitAuthorLongLength: 0
  # Tighter time formats. `3:04PM` → `15:04` saves 2 chars; `02 Jan 06` →
  # `06-01-02` keeps ISO-ish order, ~1 char savings. Go-style format syntax.
  shortTimeFormat: "15:04"
  timeFormat: "06-01-02"
