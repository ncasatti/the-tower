# Reload: CTRL + SHIFT + F5
# Cool-retro-phosphor palette (ayu-derived, saturation-boosted, cyan-tinted)
include cool-retro-phosphor.conf

# BEGIN_KITTY_FONTS
# Bionic Reading baked in via calt (see docs/bionic-font.md).
# Switch back to the plain original by swapping the family below:
#   font_family family="3270 Nerd Font Mono"
font_family      family="3270 Bionic"
# bold slots route to the Regular bionic face on purpose: app-requested bold
# renders through calt (first 2 letters) like normal text — no full-word bold.
# Revert to `auto` to bring back the heavy 3270 Bionic Bold face.
bold_font        family="3270 Bionic" style="Regular"
italic_font      auto
bold_italic_font family="3270 Bionic" style="Regular"
font_size 15
modify_font cell_width 96%
modify_font cell_height 3px
# modify_font baseline 3
# END_KITTY_FONTS

# Renderer legacy: glifo más fino y bordes nítidos (match cool-retro-term)
text_composition_strategy legacy

# Opacidad delegada a Hyprland (windows.conf → terminal-kitty-warp = $opacity8)
background_opacity 1

# Cursor parpadeante estilo CRT
cursor_blink_interval 0.5
cursor_shape block

confirm_os_window_close 0

# change to x11 or wayland or leave auto
linux_display_server wayland

scrollback_lines 2000
wheel_scroll_min_lines 1

enable_audio_bell no

# Padding horizontal y vertical (top right bottom left)
window_padding_width 8 10 8 10

# For ssh fix and true color support
term xterm-kitty

shell /usr/bin/env fish

# Shift+enter = newline (sends LF, same as Ctrl+J), no submit
map shift+enter send_text all \n


