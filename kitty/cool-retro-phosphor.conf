# Cool-Retro-Phosphor palette for Kitty
# Derivada de ayu-dark, con boost de saturación y tinte cyan-phosphor (#4a8fba)
# sobre neutrales para emular el cast cromático de cool-retro-term V2.0.
# Reemplaza el shader CRT con una paleta pre-saturada — los efectos de
# flicker/bloom/glowingLine no son reproducibles en Kitty.

# Base
background           #000000
foreground           #A8D4D8
cursor               #4A8FBA
cursor_text_color    #000000

# Selección
selection_foreground #000000
selection_background #4A8FBA

# Tabs
active_tab_foreground     #000000
active_tab_background     #4A8FBA
inactive_tab_foreground   #A8D4D8
inactive_tab_background   #1A1B1A

# Bordes
active_border_color   #4A8FBA
inactive_border_color #1A1B1A
bell_border_color     #FFB438

# ANSI normales — saturación +15% sobre ayu base
color0  #000000
color1  #FF5C6C
color2  #B5E84A
color3  #FFB438
color4  #29C5FF
color5  #DC9FFF
color6  #6FF0D5
color7  #A8D4D8

# ANSI brillantes — luminancia boosteada
color8  #4A6470
color9  #FF6B7B
color10 #C5F056
color11 #FFCD4F
color12 #4FD5FF
color13 #E5B0FF
color14 #80F5DD
color15 #C8E8EB
